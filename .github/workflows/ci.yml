name: AI Agent CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-agent-deploy
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django project
        env:
          GEMINI_API_KEY: ci-only-placeholder
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --tag ghcr.io/leahsaliba/eece430-assignment5:latest .

      - name: Publish Docker image
        run: docker push ghcr.io/leahsaliba/eece430-assignment5:latest

  deploy:
    needs: test-and-publish
    runs-on: [self-hosted, Windows, X64, ai-agent-deploy]
    steps:
      - name: Check Docker Desktop
        shell: powershell
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        shell: powershell
        run: docker pull ghcr.io/leahsaliba/eece430-assignment5:latest

      - name: Replace running app
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)) {
            throw 'Add a repository Actions secret named GEMINI_API_KEY before running deployment.'
          }
          $existing = docker ps -aq --filter "name=^/eece430-ai-agent$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing) {
            docker rm -f eece430-ai-agent
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          docker run -d --name eece430-ai-agent --restart unless-stopped -p 127.0.0.1:8000:8000 -e GEMINI_API_KEY ghcr.io/leahsaliba/eece430-assignment5:latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
